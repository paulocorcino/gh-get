globs: ["**/*.md"]
ignores:
  - docs/plans/** # generated by the staged-plan skill, kept verbatim
  - docs/lint-scripts/**
  - CLAUDE.md # one line: @AGENTS.md
config:
  MD029: false # CONTEXT.md numbers its rules 5, 5c, 6: the lettered rule splits the list
  MD031: {list_items: false}
  MD013: false # prose is wrapped by the reader, not the file
  MD033: {allowed_elements: [sub, sup, br, kbd]}

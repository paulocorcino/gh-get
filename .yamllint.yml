extends: default
ignore: |
  docs/plans/logs/
rules:
  document-start: disable # GitHub and golangci-lint files start without ---
  line-length: {max: 140} # long reasons sit beside the rule they excuse
  truthy: {check-keys: false} # the workflow key `on:`
  comments: {min-spaces-from-content: 1}
  comments-indentation: disable # commented-out example rules sit beside the rule they would join

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false # stdlib-only project: no go.sum to cache

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          targets="windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/}
            bin=gh-get
            [ "$GOOS" = "windows" ] && bin=gh-get.exe
            echo "building $GOOS/$GOARCH"
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/$bin" .

            # Raw, directly-downloadable binary (no unpacking needed).
            raw="gh-get_${GOOS}_${GOARCH}"
            [ "$GOOS" = "windows" ] && raw="${raw}.exe"
            cp "dist/$bin" "dist/$raw"

            # Versioned archive (smaller; preserves the executable bit on Unix).
            name="gh-get_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "$bin" && rm "$bin")
            else
              (cd dist && tar -czf "${name}.tar.gz" "$bin" && rm "$bin")
            fi
          done
          (cd dist && sha256sum -- * > checksums.txt)
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --verify-tag

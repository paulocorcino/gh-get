name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the debt-list check compares with the merge base
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false # stdlib-only project: no go.sum to cache
      - name: Gate
        run: scripts/check.sh
